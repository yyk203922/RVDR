### model
model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all

### dataset
dataset: pdtb2_train
eval_dataset: pdtb2_dev
dataset_dir: data
template: alpaca
cutoff_len: 512
max_samples: 20000
overwrite_cache: true
dataloader_num_workers: 4

### output
output_dir: saves/rvdr/llama31_lora_sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
seed: 0

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
